{% extends "base.html" %}
{% block title %}401 — Unauthorized{% endblock %}
{% block content %}
<div class="container error-page text-center">
    <div class="glass-card p-5" style="max-width:480px;margin:auto">
        <div class="error-code mb-3">401</div>
        <h1 class="h3 fw-bold mb-2">غير مصادق</h1>
        <p class="text-muted mb-4">يجب تسجيل الدخول للوصول إلى هذه الصفحة.</p>
        <a href="{{ url_for('auth.login') }}" class="btn btn-primary">
            <i class="bi bi-box-arrow-in-right me-2"></i>تسجيل الدخول
        </a>
    </div>
</div>
{% endblock %}
